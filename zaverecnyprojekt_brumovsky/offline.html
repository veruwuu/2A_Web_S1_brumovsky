    <link rel="stylesheet" href="style.css" />

</head>
<body>
    <div id="topbar">
        <h1>Stupid Gacha Ball Game</h1>
        <p id="balance"> 0$ </p>

            <button onclick="tabchange('job')"> JOB </button>
            <button onclick="tabchange('ballin')"> BALLIN' </button>

        <p> Ballin' ain't cost nothing, young lad </p>

    </div>
    <div id="ballin" class="tabcontent">
        <p> Kirby's not rollin' today! He's demanding Wifi and human rights! </p>
    </div>
    <div id="gallery" class="tabcontent">

    </div>
    <footer>
        <p> Hii, I (Discord: ee_echo_oo) made this, I don't know how I thought of it but it makes me laugh </p>
    </footer>
    <script src="code.js"></script>
